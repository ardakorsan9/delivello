[project]
name = "nos"
version = "0.1.0"
description = "NOS - Network Optimization System: dispatch optimizer for the GRUBER Logistics Hackathon 2026"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
solver = ["ortools>=9.10"]
ui = ["streamlit>=1.38", "plotly>=5.22", "pydeck>=0.9"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
